<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EtiHAD — Умра турлари</title>
<meta name="description" content="EtiHAD — Умра сафарлари: перелёт, отель, питание, полное сопровождение.">
<link rel="icon" type="image/svg+xml" href="assets/img/logo-placeholder.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css?v=4">
<link rel="stylesheet" href="assets/css/base.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<link rel="stylesheet" href="assets/css/responsive.css?v=4">
</head>
<body>

<div class="corner-controls">
  <div class="lang-switch">
    <button type="button" data-lang="ru">RU</button>
    <button type="button" data-lang="uz">ЎЗ</button>
    <button type="button" data-lang="tj">ТҶ</button>
  </div>
  <button type="button" id="themeToggle" class="theme-toggle" aria-label="Theme">☾</button>
</div>

<div class="contact-widget">
  <button type="button" id="contactToggleBtn" class="contact-toggle-btn" aria-expanded="false" aria-label="Связаться с нами">💬</button>
  <div class="contact-panel" id="contactPanel"></div>
</div>

<div class="wrap">

<div class="brand">
  <h1>EtiHAD</h1>
  <div class="u"></div>
  <p data-i18n="hero_sub">Перелёт, отели, питание и полное сопровождение — всё включено в один пакет.</p>
</div>

<section class="section" id="tariffs">
  <div class="container">
    <div class="section-head" id="tariffsHead">
      <div class="section-label" data-i18n="tariffs_label">Пакеты туров</div>
      <h2 class="section-title" data-i18n="tariffs_title">Выберите свой тариф</h2>
    </div>
    <div class="tiles" id="tariffs-grid"></div>

    <div class="tariff-detail" id="tariffDetail" hidden>
      <div class="topbar">
        <button type="button" class="back" id="tariffBackBtn">← <span data-i18n="btn_back">Назад</span></button>
        <div class="crumb" id="tariffCrumb"></div>
      </div>
      <div class="detail-cards" id="tariffDetailCards"></div>
    </div>
  </div>
</section>

<section class="section" id="faq">
  <div class="container">
    <div class="section-head">
      <div class="section-label" data-i18n="faq_label">FAQ</div>
      <h2 class="section-title" data-i18n="faq_title">Часто задаваемые вопросы</h2>
    </div>
    <div class="faq-list" id="faq-list" style="max-width:720px;margin:0 auto;"></div>
  </div>
</section>

<section class="section" id="contacts">
  <div class="container">
    <div class="section-head">
      <div class="section-label" data-i18n="contacts_label">Связь с нами</div>
      <h2 class="section-title" data-i18n="contacts_title">Контакты и адрес</h2>
    </div>
    <div class="contacts-grid" id="contacts-grid"></div>
  </div>
</section>

</div><!-- /.wrap -->

<footer class="site-footer">
  <div class="container">
    EtiHAD © <span id="year"></span> — <span data-i18n="footer_rights">Все права защищены.</span>
  </div>
</footer>

<!-- ============ Media (photo/video) modal ============ -->
<div class="modal-backdrop" id="mediaBackdrop">
  <div class="media-modal">
    <div class="media-modal-head">
      <span id="mediaLabel" style="font-size:13px;"></span>
      <button type="button" class="modal-close" id="mediaCloseBtn" aria-label="Close">✕</button>
    </div>
    <div class="media-stage">
      <button type="button" class="media-nav-btn prev" id="mediaPrev" aria-label="Prev">‹</button>
      <video id="mediaVideo" playsinline controls style="display:none;"></video>
      <img id="mediaImage" alt="" style="display:none;">
      <button type="button" class="media-nav-btn next" id="mediaNext" aria-label="Next">›</button>
    </div>
    <div class="media-footer">
      <span class="media-label" id="mediaFooterLabel"></span>
      <button type="button" class="media-share-btn" id="mediaShareBtn">💾</button>
    </div>
    <div class="media-thumbs" id="mediaThumbs"></div>
  </div>
</div>

<!-- ============ Lead form modal ============ -->
<div class="modal-backdrop" id="leadBackdrop">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-box-head">
      <div class="modal-box-title" data-i18n="form_title">Оставить заявку</div>
      <button type="button" class="modal-close" id="leadModalCloseBtn" aria-label="Close">✕</button>
    </div>
    <div style="padding:20px 22px;">
      <div id="leadPackageLabel" style="display:none;font-size:12px;color:var(--gold);font-weight:600;margin-bottom:10px;"></div>
      <form class="lead-form" id="leadForm">
        <input type="hidden" id="leadPackageName">
        <input type="text" class="lead-form-honeypot" id="leadHoneypot" name="company" tabindex="-1" autocomplete="off">
        <label>
          <span data-i18n="form_firstname">Имя</span>
          <input type="text" id="leadFirstName" required autocomplete="given-name">
        </label>
        <label>
          <span data-i18n="form_lastname">Фамилия</span>
          <input type="text" id="leadLastName" required autocomplete="family-name">
        </label>
        <label>
          <span data-i18n="form_phone">Номер телефона</span>
          <input type="tel" id="leadPhone" required autocomplete="tel">
        </label>
        <label>
          <span data-i18n="form_dates">Предпочтительные даты</span>
          <input type="text" id="leadDates" placeholder="напр. 10-20 марта">
        </label>
        <button type="submit" class="lead-submit" data-i18n="form_submit">Отправить заявку</button>
        <div class="lead-status" id="leadStatus"></div>
      </form>
    </div>
  </div>
</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script type="module" src="assets/js/main.js?v=4"></script>
</body>
</html>
